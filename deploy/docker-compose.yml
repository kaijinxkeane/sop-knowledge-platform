# Local development / single-machine deployment (Mac mini or Windows+WSL2).
# Ollama runs natively on the host (Docker can't use the Mac GPU), reached via
# host.docker.internal. `web` (Caddy) serves the frontend and proxies /api;
# TLS and Headscale arrive in Phase 6.
#
#   open http://localhost:8080      # the web app (WEB_PORT)
#
#   cp .env.example .env            # then edit
#   ./deploy/init-demo-vault.sh     # development only: create the demo vault repo
#   docker compose -f deploy/docker-compose.yml up -d --build

name: sop-platform

x-backend: &backend
  build:
    context: ..
    dockerfile: backend/Dockerfile
  env_file:
    - path: ../.env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://sop:${POSTGRES_PASSWORD:-sop-dev-only}@postgres:5432/sop
    REDIS_URL: redis://redis:6379/0
    VAULT_PATH: /vault
    SOP_CONFIG_DIR: /config
    SOP_CACHE_DIR: /cache
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    # uvicorn trusts X-Forwarded-For only from Caddy (`web`), so the sign-in
    # rate limit sees each person's address, not one shared proxy address.
    FORWARDED_ALLOW_IPS: ${WEB_IP:-172.29.86.10}
  volumes:
    - ${VAULT_HOST_PATH:-./data/vault}:/vault
    - ../config:/config:ro
    # Slide pictures, shared by the API and the worker (content: only served after access checks).
    - cache:/cache
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sop-dev-only}
      POSTGRES_DB: sop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sop -d sop"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Bound to localhost only: never reachable from the network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend
    command: ["arq", "app.workers.main.WorkerSettings"]

  web:
    build:
      context: ../frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    networks:
      default:
        ipv4_address: ${WEB_IP:-172.29.86.10}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        # Fixed so the API can trust exactly one proxy address (WEB_IP).
        - subnet: ${STACK_SUBNET:-172.29.86.0/24}

volumes:
  pgdata:
  redisdata:
  cache:
