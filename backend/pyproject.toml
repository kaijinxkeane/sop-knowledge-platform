[project]
name = "sop-platform-backend"
version = "0.1.0"
description = "SOP & knowledge retention platform: API, agents, workers"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "redis>=5.2",
    "arq>=0.26",
    "anthropic>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "pyjwt>=2.10",
    "cryptography>=43",
    "email-validator>=2.2",
    "python-pptx>=1.0.2",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "reportlab>=5.1.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "wiki_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: calls real model providers (Claude API / local Ollama); skipped unless SOP_LIVE_TESTS=1",
    "db: needs Postgres (docker compose stack); skipped if unreachable unless SOP_REQUIRE_DB=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Cookie", "fastapi.Query", "fastapi.Header", "fastapi.File", "fastapi.Form"]
