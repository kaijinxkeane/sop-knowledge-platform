# How the platform reads the vault (plan §3.1, §4.1). Human decisions only:
# folder rules here rank second, after labels in a note's own frontmatter.
# Anything no rule covers stays unassigned and restricted (quarantined) until
# a reviewer places it (Phase 2b review queue).

ignore: [".git/", ".obsidian/", ".trash/", "_templates/"]

# Delivery stages, in order (frontmatter `stage:` values).
stages: [discovery, strategy, content, delivery, follow-up]

# Where uploads from the app are stored.
attachments_folder: "Training Content/Attachments"

# Longest matching prefix wins. `sensitivity` is used only when the note
# doesn't declare one itself.
folder_rules:
  - {path: "Programmes/", space: core, sensitivity: internal}
  - {path: "Methodology/", space: core, sensitivity: internal}
  - {path: "Shared Templates/", space: core, sensitivity: internal}
  - {path: "Training Content/", space: core, sensitivity: internal}
  - {path: "Commercial/", space: core, sensitivity: restricted}
  - {path: "Public/", space: core, sensitivity: public}
  - {path: "IT/", space: it, sensitivity: internal}
  - {path: "HR/", space: hr, sensitivity: internal}

# Deterministic safeguards: any match forces `restricted`, whatever else says.
flagged_terms: ["rate card", "floor price", "pricing", "discount"]

# Name detector (plan §4.1): in these spaces a note stays `restricted` until
# the local model has checked it for people's or organisations' names, and
# while any name remains that is not staff (from the user list), not listed
# below, and not confirmed safe by a reviewer.
name_check_spaces: [core]
known_names:   # the company's own names, programme and method names: never flagged
  - Signature Personal Brand Programme
  - Executive Presence
  - Brand Pillars
  - Brand Foundations
  - Story Method

# Notes the Classifier can't place go to their author (app creator, or the
# first commit's author), otherwise to the leads (`approve`) of this space.
unplaced_reviewers: core

# SOP governance (plan §6, Phase 4).
governance:
  review_cycle_days: 180     # default when a note has no review_cycle_days
  reminder_days: 14          # remind owners and leads this long before review_due
  # After approval, write status/reviewer/approved_by/approved_on/review_due back
  # into the note's frontmatter as a commit by the platform account. These keys
  # never count as a change to the approved content.
  write_back: true

# Knowledge retention (plan §7, Phase 5).
handovers:
  folder: Handovers          # handover notes live here, one folder per space
  # Besides the author, the receivers and the space's leads (`approve`), these
  # roles can read every handover (the CEO).
  always_visible_roles: [core-lead]

# Chat history, searches, gap events and notifications are deleted after this
# many months (plan §11; confirmed with the auditor 2026-11-20).
retention_months: 24

# Project spaces (app/projects): notes under Projects/<slug>/ belong to the
# project. Sharing from departments ends with the project (renew every 6 months).
projects:
  folder: Projects
  max_days: 184
  reminder_days: 14

# Answers (app/agents/output_guard.py): links in answers are removed unless their
# domain is listed here (images always are). Add the company's own domains, e.g.
# [intranet.example.com]. Empty: no links in answers.
answers:
  allowed_link_domains: []
