  # --- harder: long passages and implicit conflicts (added 2026-11-23) -------------
  # buried     a conflict inside a long passage that is otherwise consistent
  # implicit   a conflict that needs a small inference (units, calendars, roles)
  # long       long same-topic passages that agree (hard negative)
  # equivalent different words or units for the same rule (hard negative)
  - id: d33
    conflict: true
    kind: buried
    a:
      title: "Executive Presence Workshop - Running the Day"
      text: >-
        Arrive at 8:15 to set up the room in a U-shape with the flip chart at the open end. Test the
        camera and the clicker before anyone arrives. Welcome participants at the door and hand out
        name cards. Open at 9:00 with the agenda and the ground rules. The morning covers first
        impressions, posture and voice, with a short exercise after each part. Lunch is at 12:30
        for 45 minutes. In the afternoon, each participant gives a 2-minute pitch to the group and
        receives feedback from two peers and the trainer. Close at 17:00 with the closing circle.
    b:
      title: "Pitch Practice Exercise"
      text: >-
        The pitch exercise is the centre of the afternoon. Brief the group on the feedback rules:
        start with one strength, then one change, and keep it specific. Each participant has
        4 minutes for their pitch so there is time to recover from a slow start. Feedback comes from
        two peers and then the trainer. Keep a visible timer on the screen so people can pace
        themselves, and thank each speaker before moving on.
  - id: d34
    conflict: true
    kind: buried
    a:
      title: "Expense Claims"
      text: >-
        Claims are made through the expenses form on the staff portal. Attach a photo of each
        receipt; a bank statement is not a receipt. Taxi trips need the start and end points.
        Client meals need the client's company name and the number of people. Claims must be
        submitted within 30 days of the purchase. Your manager approves the claim, then finance
        pays it with the next payroll. Claims over $500 also need the CEO's approval.
    b:
      title: "Client Entertainment"
      text: >-
        Taking a client to lunch is a normal part of the programmes. Keep it simple and choose a
        place close to the office. Note the client's company and the number of people on the
        receipt. Any claim for client entertainment is approved by finance directly, without your
        manager, so it can be processed faster. Alcohol is not reimbursed.
  - id: d35
    conflict: true
    kind: buried
    a:
      title: "New Hire Onboarding Checklist"
      text: >-
        Before day one: HR sends the welcome email and the staff notice, and the IT lead prepares
        the laptop. On day one: the new hire meets their buddy, gets a building pass and a tour,
        and reads the staff notice. In week one: they shadow two training sessions and complete the
        password manager setup. The probation review takes place at the end of month three with
        the hiring manager and HR.
    b:
      title: "Probation Reviews"
      text: >-
        Every new hire has a probation review with their hiring manager. Prepare by collecting
        feedback from the people they worked with most. Discuss what went well and what to work
        on. The review is held at the end of the sixth month. Record the outcome in the HR system
        the same week and tell HR if the probation should be extended.
  - id: d36
    conflict: true
    kind: buried
    a:
      title: "Signature Programme - Content Stage"
      text: >-
        In the content stage, the client and trainer turn the brand statement into posts. Plan a
        month of content in the first content session. The client drafts; the trainer edits for
        voice. Each post is checked against the brand pillars. The client publishes from their own
        account. The trainer never posts on the client's behalf, even if the client asks, because
        the voice must stay the client's own.
    b:
      title: "Client Social Accounts Handover"
      text: >-
        Some clients want help getting started on social media. Store their login in the company
        password manager, in the client's shared folder. When a client is travelling or busy, the
        trainer may publish the approved posts from the client's account on their behalf, and
        tells the client the same day. Remove the login from the password manager at the end of
        the programme.
  - id: d37
    conflict: true
    kind: implicit
    a: {title: "Leave Policy", text: "Request annual leave at least two weeks before the first day off."}
    b: {title: "Team Calendar", text: "Leave requests need 5 working days' notice so the team calendar can be updated."}
  - id: d38
    conflict: true
    kind: implicit
    a: {title: "Booking a Training Room", text: "Only staff with the contribute permission may book the Large Room."}
    b: {title: "New Hire Onboarding Checklist", text: "In their first week, every new hire, including those with read-only access, books the Large Room for their practice session."}
  - id: d39
    conflict: true
    kind: implicit
    a: {title: "Reviewing SOPs", text: "Each SOP is reviewed every 6 months by its owner."}
    b: {title: "SOP Template", text: "Set the review cycle field to 365 days for every new SOP."}
  - id: d40
    conflict: true
    kind: implicit
    a: {title: "Workshop Cancellations", text: "Places can be moved to another date with at least 7 days' notice."}
    b: {title: "Workshop Sales Guide", text: "Tell clients they can move their place for free up until the Friday before a Monday workshop."}
