# Conflict-check eval, DEV set (plan §7). FICTIONAL data only.
#
#   python -m app.cli eval-conflicts [--mode strict|screen] [--set dev|holdout]
#
# Each item is a pair of passages from two different approved SOPs, as the
# nightly check sees them (the search index already found them close in
# meaning). `conflict: true` means a member of staff following both would get
# different instructions for the same situation.
#
# Tune prompts on this file only. conflicts-holdout.yaml is for the final
# comparison and must not be used to adjust anything.
#
# Kinds of conflict: number, deadline, owner, order, rule (yes/no), tool.
# Kinds of non-conflict (hard negatives, all on the same topic):
#   detail     one passage adds detail the other leaves out
#   situation  same topic, but different situations (programme, online/in person)
#   reworded   same instruction in different words
#   exception  one states an exception that the other explicitly allows

items:
  # --- conflicts ------------------------------------------------------------------
  - id: d01
    conflict: true
    kind: number
    a: {title: "Executive Presence Workshop - Running the Day", text: "Groups are 6 to 10 participants. If more than 10 sign up, open a second date rather than enlarging the group."}
    b: {title: "Workshop Sales Guide", text: "The Executive Presence Workshop takes up to 14 participants per group, so fill each date before offering a new one."}
  - id: d02
    conflict: true
    kind: deadline
    a: {title: "Expense Claims", text: "Submit expense claims with receipts within 30 days of the purchase. Late claims need your manager's written approval."}
    b: {title: "Finance Month-End Checklist", text: "Staff must submit all expense claims within 14 days of purchase so finance can close the month."}
  - id: d03
