# Answering eval (plan §5.2, "Local answering eval"). Demo vault only: fictional data.
#
# Each question is asked by a demo role, through the real pipeline (search under
# RLS, routing, department agents). Grading is deterministic:
#   include:          every group must match (any alternative in a group, case-insensitive)
#   docs:             the answer must cite at least one of these vault paths
#   spaces:           the router must include these spaces
#   no_answer: true   the right answer is "no SOP covers this" (abstention)
#   must_not_include: strings that must never appear (leak / injection checks)
# Sets: answering, reasoning, abstention, adversarial.
# About 200 questions; the plan's full size is ~50 per space plus reasoning/tool sets.

roles:
  new_hire: [employee]
