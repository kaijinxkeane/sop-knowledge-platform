    a: {title: "Office Opening and Closing", text: "The first person in turns off the alarm and switches on the lights and the coffee machine. Check the meeting rooms are tidy. The last person out closes the windows, turns off the coffee machine and sets the alarm. Collect visitor access cards from the reception tray at the end of the day."}
