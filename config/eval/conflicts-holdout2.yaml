    kind: exception
    a: {title: "Confidential Client Notes", text: "Coaching notes are never emailed. They stay in the client folder."}
    b: {title: "Coach Handover Between Sessions", text: "When another coach takes over, give them access to the client folder; don't send the notes themselves."}
  - id: k30
    conflict: false
    kind: exception
    a: {title: "Travel Bookings", text: "All flights are booked through the travel portal."}
    b: {title: "Last-Minute Travel", text: "If the portal is down and the trip is within 48 hours, the office manager may book by phone and add the booking to the portal afterwards, as the travel policy allows."}
  - id: k31
    conflict: false
    kind: long
    a: {title: "Preparing Workshop Materials", text: "Two weeks before a workshop, confirm the participant list with the client. Print one workbook per participant plus two spares. Pack name badges, markers and sticky notes in the materials box. Check the projector adaptor is in the box. Bring the attendance sheet and the consent forms. Label the box with the venue and date."}
    b: {title: "Venue Day Checklist", text: "Arrive an hour before the start to set up. Test the projector and the sound. Lay out workbooks, name badges and markers on each table. Ask each participant to sign the attendance sheet as they arrive. Put the welcome slide up and the timer on the trainer's table. Open the windows for ten minutes if the room is stuffy."}
  - id: k32
    conflict: false
