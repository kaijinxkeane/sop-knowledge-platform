    a: {title: "Client Photos and Consent", text: "Only photograph participants who have signed the consent form."}
    b: {title: "Workshop Wrap-Up", text: "Before the group photo, check the consent forms; anyone who hasn't signed one stands out of the picture."}
  - id: k28
    conflict: false
    kind: reworded
    a: {title: "Social Media Posts", text: "The marketing lead signs off any post that names a client."}
    b: {title: "Celebrating Client Wins", text: "Draft the client story and send it to the marketing lead; it goes live once they approve it."}
  - id: k29
