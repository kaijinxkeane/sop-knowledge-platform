    a: {title: "New Trainer Onboarding", text: "In their first month, new trainers observe two full programmes. They read the Signature and Executive Presence SOPs and the brand method notes. They meet each department lead for half an hour. They shadow a coaching session with the client's permission. At the end of the month they co-deliver one workshop with a senior trainer."}
