# Model tiers (plan §5.1, §5.2). Agents request a tier, never a model name.
# Moving a tier to a local model is a change to this file only.
#
#   provider: anthropic      -> Claude API (always location: cloud)
#   provider: openai_compat  -> any OpenAI-compatible server (Ollama, vLLM, ...).
#                               Counts as cloud unless `location: local` is set.
#
# Content from `local_only` spaces (config/spaces/*.yaml) and unclassified
# content are refused by cloud tiers.

tiers:
  # Routing is permissions + search with no model (plan §5, Routing). This
  # tier is used only when search is unclear, and for nightly gap-topic labels.
  # Local; never falls back to Claude. Uses the 8B like answering and the
  # Classifier, so only one chat model stays loaded (eval 2026-11-21: routing
  # 100% either way, answers 94.2% vs 94.7% with the 4B, p=1.0; faster overall).
  router:
    provider: openai_compat
    location: local
    base_url: ${OLLAMA_BASE_URL}/v1
    model: qwen3:8b  # same model as answering: one resident chat model on 16 GB
    max_tokens: 256
    think: false

  # Default answering tier (most questions).
  answer:
    provider: anthropic
    model: claude-haiku-5-5
    effort: medium
    max_tokens: 8000
    # No API key yet, or Claude unreachable: answer locally instead of failing.
    fallback_tier: answer-local

  # Escalation for questions that need real reasoning.
  reasoning:
    provider: anthropic
    model: claude-sonnet-5-5
    effort: medium
    max_tokens: 16000
    fallbacks: default
    fallback_tier: answer-local

  # Reads every note to propose access labels -> local from day one.
  classifier:
    provider: openai_compat
    location: local
    base_url: ${OLLAMA_BASE_URL}/v1
    # Blind eval, 120 items x 3 runs: 8b 76.4% vs 4b-instruct 63.3% (McNemar p=0.002).
    model: qwen3:8b
    max_tokens: 1024
    think: false

  # Background writing nobody waits for: Librarian reports, review summaries,
  # handover completeness checks. Local, so this data never leaves the server.
  # Runs one job at a time; live questions take priority (plan §5).
  background:
    provider: openai_compat
    location: local
    base_url: ${OLLAMA_BASE_URL}/v1
    model: qwen3:8b
    max_tokens: 2048
    think: false

  # Second opinion for the nightly conflict check (plan §7): runs only on pairs
  # the 8B flagged, after all 8B checks, so each model loads once. Thinking on:
  # without it the 14B agreed with every 8B flag (eval 2026-11-24); with it,
  # false alarms fell 12.5% -> 4.2% (dev) and 13.0% -> 5.6% (held out), no
  # conflicts lost. ~9.6 GB and 30-80 s a pair, at most 60 a night (3 am). Remove this tier to
  # go back to the 8B alone (e.g. if `ollama pull qwen3:14b` isn't possible).
  conflict-confirm:
    provider: openai_compat
    location: local
    base_url: ${OLLAMA_BASE_URL}/v1
    model: qwen3:14b
    max_tokens: 8192

  # Local answering: the fallback for answer/reasoning, and the first local
  # candidate in the answering eval (config/eval/answer-candidates.yaml).
  answer-local:
    provider: openai_compat
    location: local
    base_url: ${OLLAMA_BASE_URL}/v1
    model: qwen3:8b
    max_tokens: 2048
    think: false

  # Search index embeddings (multilingual, long context, 1024-dim) -> always local.
  # Queries need an instruction prefix; documents are embedded as-is.
  embedding:
    provider: openai_compat
    location: local
    base_url: ${OLLAMA_BASE_URL}/v1
    model: qwen3-embedding:0.6b
