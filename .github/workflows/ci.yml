name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sop
          POSTGRES_PASSWORD: sop-dev-only
          POSTGRES_DB: sop
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U sop -d sop" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      SOP_REQUIRE_DB: "1"   # database tests must run in CI, never silently skip
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    name: Frontend (API client, lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
      # Fails if the backend API changed and the typed client wasn't regenerated.
      - run: npm run check:api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:size

  docker:
    name: Images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t sop-backend:ci .
      - run: docker build -t sop-web:ci frontend

  llm-wiki:
    name: Inherited llm-wiki structural tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/generate-defect-fixtures.sh
      - run: make plugin-tests
